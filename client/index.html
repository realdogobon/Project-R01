<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoyScript TSR</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet" />
    <script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.8.0-release.10/dist/opencv.js" id="opencvjs" type="text/javascript"></script>
    <link rel="icon" href="/assets/images/scanner-192.png" type="image/png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        // Service worker only on production builds — dev previews must never cache stale
        // module graphs (Vite optimized-deps hashes change on every dependency update,
        // and a cached shell pointing at old chunks crashes the app). Offline support
        // remains fully intact for published users.
        const isDev = location.hostname !== "royscript-qeditcvm.manus.space";
        if (!isDev) {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("/sw.js")
              .then((reg) => console.log("RoyScript TSR SW Registered successfully:", reg.scope))
              .catch((err) => {
                console.warn("SW Registration failed:", err);
              });
          });
        }
      }
    </script>
  </body>
</html>
